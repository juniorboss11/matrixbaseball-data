name: Refresh MatrixHockey

on:
  # Each run loops every 15 min for ~5.5 h (see hockey-loop.sh). Several kicks a day because
  # GitHub skips many scheduled runs; extra kicks just queue behind the running loop.
  schedule:
    - cron: "3 14,16,19,21,23 * * *"
    - cron: "3 1,3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hockey-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh loop (every 15 min)
        run: bash hockey-loop.sh
