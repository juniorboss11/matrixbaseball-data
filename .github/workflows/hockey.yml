name: Refresh MatrixHockey

on:
  # Each run loops every 15 min for ~5.5 h, then dispatches the next run (see hockey-loop.sh).
  # Crons are only a backup in case the chain breaks; extra kicks just queue behind the running loop.
  schedule:
    - cron: "3 14,16,19,21,23 * * *"
    - cron: "3 1,3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: hockey-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh loop (every 15 min)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash hockey-loop.sh
